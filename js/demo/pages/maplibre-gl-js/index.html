<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MapLibre GL JS · COGP Demo</title>
    <link rel="stylesheet" href="../../src/shared/base.css" />
    <link rel="stylesheet" href="../../src/shared/panel.css" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl.css"
    />
  </head>
  <body>
    <aside id="panel" class="panel">
      <header class="panel-header">
        <div>
          <h1>COGP Demo</h1>
          <p class="subtitle">Cloud Optimized GeoParquet in the browser</p>
        </div>
        <button
          id="panel-toggle"
          class="icon-button"
          type="button"
          aria-controls="panel-body"
          aria-expanded="true"
          aria-label="Collapse panel"
        >
          <span aria-hidden="true">▾</span>
        </button>
      </header>
      <div id="panel-body" class="panel-body">
        <p class="hint">
          Map tiles are read straight from one Parquet file with HTTP range
          requests, then encoded to MVT in a worker.
          <a
            href="https://github.com/Kanahiro/cloud-optimized-geoparquet"
            target="_blank"
            rel="noopener noreferrer"
            >Spec &amp; source</a
          >
        </p>

        <section class="field">
          <label for="preset">Dataset</label>
          <select id="preset">
            <option value="">Choose a sample…</option>
            <option value="https://cogp-demo.spatialty.io/v2.0.0/pois.cogp.parquet">
              POIs (OSM)
            </option>
            <option value="https://cogp-demo.spatialty.io/v2.0.0/segments.cogp.parquet">
              Road segments (Overture Maps)
            </option>
            <option value="https://cogp-demo.spatialty.io/v2.0.0/buildings.cogp.parquet">
              Buildings (Overture Maps)
            </option>
            <option value="https://cogp-demo.spatialty.io/v2.0.0/admin.cogp.parquet">
              Administrative boundaries
            </option>
          </select>
        </section>

        <section class="field">
          <label for="url">Or a COGP file URL</label>
          <div class="input-row">
            <input
              id="url"
              type="url"
              inputmode="url"
              autocomplete="off"
              spellcheck="false"
              placeholder="https://example.com/data.cogp.parquet"
            />
            <button id="load" type="button">Load</button>
          </div>
        </section>

        <section class="options">
          <label class="checkbox">
            <input id="fetch-properties" type="checkbox" />
            <span>
              Fetch attributes
              <small>Adds attribute columns to tile reads; hover a feature to see them.</small>
            </span>
          </label>
          <button id="fly" class="secondary" type="button" disabled>Fit to data</button>
        </section>

        <p id="status" class="status" role="status">Choose a dataset to start.</p>

        <dl id="stats" class="stats" hidden>
          <dt>Level</dt>
          <dd id="stat-level">–</dd>
          <dt>In view</dt>
          <dd id="stat-features">–</dd>
          <dt>Fetched</dt>
          <dd id="stat-fetched">–</dd>
          <dt>Tile time</dt>
          <dd id="stat-tiles">–</dd>
        </dl>

        <details class="metadata">
          <summary>GeoParquet metadata</summary>
          <pre id="meta"></pre>
        </details>
      </div>
    </aside>
    <div id="map"></div>
    <script type="module" src="../../src/pages/maplibre-gl-js/main.ts"></script>
  </body>
</html>
